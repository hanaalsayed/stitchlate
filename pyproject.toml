[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stitchlate"
version = "0.1.0"
description = "Convert images into cross-stitch patterns using DMC thread colors"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "pillow>=10.0"]

[project.scripts]
stitchlate = "stitchlate.cli:main"

[tool.setuptools]
packages = ["stitchlate"]

[tool.setuptools.package-data]
stitchlate = ["data/*.csv"]